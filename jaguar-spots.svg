<svg xmlns="http://www.w3.org/2000/svg" width="260" height="260" viewBox="0 0 260 260">
  <!-- Rosetas de jaguar en tono cálido translúcido: legible sobre claro y oscuro -->
  <g fill="#b98a3a" fill-opacity="0.5" stroke="#b98a3a" stroke-opacity="0.5">
    <!-- roseta 1 -->
    <g transform="translate(48 54) rotate(12)">
      <ellipse cx="-14" cy="-6" rx="6" ry="4"/>
      <ellipse cx="-4" cy="-15" rx="5.5" ry="4"/>
      <ellipse cx="10" cy="-12" rx="6" ry="4.5"/>
      <ellipse cx="16" cy="2" rx="5.5" ry="4"/>
      <ellipse cx="8" cy="14" rx="6" ry="4"/>
      <ellipse cx="-8" cy="13" rx="5.5" ry="4.5"/>
      <ellipse cx="-16" cy="6" rx="4.5" ry="4"/>
      <circle cx="-1" cy="-1" r="3.2"/>
    </g>
    <!-- roseta 2 -->
    <g transform="translate(170 40) rotate(-20)">
      <ellipse cx="-12" cy="-5" rx="5" ry="3.6"/>
      <ellipse cx="-2" cy="-13" rx="5" ry="3.6"/>
      <ellipse cx="11" cy="-9" rx="5.5" ry="4"/>
      <ellipse cx="14" cy="4" rx="5" ry="3.6"/>
      <ellipse cx="4" cy="13" rx="5.5" ry="4"/>
      <ellipse cx="-11" cy="9" rx="5" ry="4"/>
      <circle cx="0" cy="0" r="3"/>
    </g>
    <!-- roseta 3 -->
    <g transform="translate(210 150) rotate(30)">
      <ellipse cx="-13" cy="-6" rx="6" ry="4.2"/>
      <ellipse cx="-2" cy="-15" rx="5.5" ry="4"/>
      <ellipse cx="12" cy="-11" rx="6" ry="4.4"/>
      <ellipse cx="16" cy="3" rx="5.5" ry="4"/>
      <ellipse cx="6" cy="14" rx="6" ry="4.2"/>
      <ellipse cx="-11" cy="12" rx="5.5" ry="4.4"/>
      <circle cx="0" cy="-1" r="3.2"/>
    </g>
    <!-- roseta 4 -->
    <g transform="translate(96 168) rotate(-8)">
      <ellipse cx="-12" cy="-6" rx="5.5" ry="4"/>
      <ellipse cx="-1" cy="-14" rx="5" ry="3.8"/>
      <ellipse cx="12" cy="-10" rx="5.5" ry="4.2"/>
      <ellipse cx="15" cy="4" rx="5" ry="3.8"/>
      <ellipse cx="5" cy="14" rx="5.5" ry="4"/>
      <ellipse cx="-11" cy="11" rx="5" ry="4"/>
      <circle cx="0" cy="0" r="3"/>
    </g>
    <!-- manchas sueltas para densidad -->
    <ellipse cx="20" cy="210" rx="6" ry="4.5" transform="rotate(20 20 210)"/>
    <ellipse cx="240" cy="235" rx="5.5" ry="4" transform="rotate(-15 240 235)"/>
    <ellipse cx="140" cy="110" rx="5" ry="4"/>
    <ellipse cx="120" cy="235" rx="5.5" ry="4.2" transform="rotate(10 120 235)"/>
  </g>
</svg>
